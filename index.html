    <title>Sermon Notes · JGM</title>
    <script>
      // Set the theme before first paint so there is no flash. Light unless the visitor chose dark.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
